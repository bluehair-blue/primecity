<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프라임시티 — PRIME CITY</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&family=Crimson+Pro:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes charScanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes charGlowPulse {
        0%, 100% { opacity: 0.04; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.1; transform: translate(-50%, -50%) scale(1.15); }
      }
      @keyframes scrollPulse {
        0%, 100% { opacity: 0.4; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(6px); }
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bgMarquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes bgMarqueeReverse {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0); }
      }
      @keyframes holoRingSpin {
        from { transform: rotateX(70deg) rotateZ(0deg); }
        to { transform: rotateX(70deg) rotateZ(360deg); }
      }
      @keyframes holoRingSpinReverse {
        from { transform: rotateX(70deg) rotateZ(360deg); }
        to { transform: rotateX(70deg) rotateZ(0deg); }
      }
      @keyframes charGlitch {
        0% { opacity: 0; clip-path: inset(0 0 100% 0); }
        10% { opacity: 1; clip-path: inset(0 0 60% 0); }
        20% { opacity: 0.6; clip-path: inset(20% 0 40% 0); }
        30% { opacity: 1; clip-path: inset(0 0 20% 0); }
        50% { opacity: 0.8; clip-path: inset(10% 0 0 0); }
        70% { opacity: 1; clip-path: inset(0); }
        100% { opacity: 1; clip-path: inset(0); }
      }
      @keyframes jgrKenBurns {
        0%   { transform: scale(1.0);  transform-origin: 30% 40%; }
        40%  { transform: scale(1.12); transform-origin: 60% 35%; }
        100% { transform: scale(1.18); transform-origin: 45% 55%; }
      }
      /* Cinematic intro keyframes */
      @keyframes cinemaCutIn {
        0% { opacity: 0; }
        1% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes cinemaClipUp {
        0% { clip-path: inset(100% 0 0 0); }
        100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes cinemaGlitchLayer {
        0%, 100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
        25% { transform: translate(-2px, 1px); filter: hue-rotate(15deg); }
        50% { transform: translate(2px, -1px); filter: hue-rotate(-10deg); }
        75% { transform: translate(-1px, 2px); filter: hue-rotate(5deg); }
      }
      @keyframes cinemaFlash {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes cinemaFogDrift {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-5%); }
      }
      @keyframes cinemaCardFlip {
        0% { transform: perspective(1200px) rotateY(90deg); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: perspective(1200px) rotateY(0deg); opacity: 1; }
      }
      @keyframes cinemaPageWipe {
        0% { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
        100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      }
      @keyframes cinemaRippleFade {
        0% { opacity: 0.5; transform: scaleY(1.02); }
        100% { opacity: 1; transform: scaleY(1); }
      }
      @keyframes cinemaTypewriter {
        0% { width: 0; }
        100% { width: 100%; }
      }
      @keyframes cinemaSunriseFlare {
        0%   { opacity: 0; transform: translateX(-20%); }
        40%  { opacity: 0.65; }
        100% { opacity: 0; transform: translateX(20%); }
      }
      @keyframes cinemaIrisWipe {
        0%   { clip-path: circle(100% at center); opacity: 1; }
        50%  { clip-path: circle(0% at center);   opacity: 1; }
        100% { clip-path: circle(0% at center);   opacity: 0; }
      }
      @keyframes cinemaLshPan {
        0%   { transform: scale(2.0) translateY(-18%); }
        100% { transform: scale(2.0) translateY(12%); }
      }
      @keyframes cinemaGlitchMain {
        0%   { transform: translate(0, 0); }
        5%   { transform: translate(-8px, 3px); }
        10%  { transform: translate(6px, -2px); }
        17%  { transform: translate(-5px, 2px); }
        25%  { transform: translate(4px, -1px); }
        38%  { transform: translate(-3px, 1px); }
        52%  { transform: translate(2px, -1px); }
        68%  { transform: translate(-1.5px, 0.5px); }
        82%  { transform: translate(1px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes cinemaGlitchR {
        0%   { transform: translate(0, 0); }
        8%   { transform: translate(-6px, 2px); }
        14%  { transform: translate(4px, -1px); }
        22%  { transform: translate(-3px, 1px); }
        35%  { transform: translate(2px, -1px); }
        50%  { transform: translate(-1.5px, 0.5px); }
        70%  { transform: translate(1px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes cinemaGlitchG {
        0%   { transform: translate(0, 0); }
        10%  { transform: translate(4px, -2px); }
        18%  { transform: translate(-3px, 1px); }
        30%  { transform: translate(2.5px, -0.5px); }
        55%  { transform: translate(-1px, 0.5px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes cinemaGlitchB {
        0%   { transform: translate(0, 0); }
        6%   { transform: translate(5px, 1px); }
        16%  { transform: translate(-4px, -1px); }
        28%  { transform: translate(3px, 0.5px); }
        45%  { transform: translate(-2px, 0.5px); }
        65%  { transform: translate(1.5px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes cinemaGlitchText {
        0%   { transform: translate(0, 0); }
        12%  { transform: translate(-3px, 1px); }
        22%  { transform: translate(2px, 0); }
        38%  { transform: translate(-1.5px, 0.5px); }
        60%  { transform: translate(1px, 0); }
        100% { transform: translate(0, 0); }
      }
      /* NHR FogIntro v6 — 전자기 신호 튜닝 인트로 */
      @keyframes cinemaNhrFlash {
        0%   { opacity: 0; }
        8%   { opacity: 1; }
        38%  { opacity: 1; }
        42%  { opacity: 0.18; }
        48%  { opacity: 1; }
        78%  { opacity: 1; }
        82%  { opacity: 0.22; }
        88%  { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes cinemaNhrCrackle {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(-2px, 1px); }
        50%  { transform: translate(1px, -2px); }
        75%  { transform: translate(-1px, 2px); }
        100% { transform: translate(2px, -1px); }
      }
      @keyframes cinemaNhrGlitchBars {
        0%   { transform: translateY(0) scaleX(1); }
        33%  { transform: translateY(-12%) scaleX(1.015); }
        66%  { transform: translateY(22%) scaleX(0.985); }
        100% { transform: translateY(-5%) scaleX(1); }
      }
      @keyframes cinemaNhrPulse {
        0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.55); }
        15%  { opacity: 0.9;  transform: translate(-50%, -50%) scale(1); }
        50%  { opacity: 0.35; transform: translate(-50%, -50%) scale(1.12); }
        80%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.2); }
      }
      @keyframes cinemaNhrFlashOverlay {
        0%   { opacity: 0.85; }
        100% { opacity: 0; }
      }
      @keyframes mmrCommentRise {
        0%   { transform: translateY(40px); opacity: 0; }
        15%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { transform: translateY(-520px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
