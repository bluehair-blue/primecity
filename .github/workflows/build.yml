name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Validate Persona Forge scenarios
        run: npm run validate:persona

      - name: Validate frontend routes
        run: npm run validate:routes

      - name: Build
        run: npm run build
